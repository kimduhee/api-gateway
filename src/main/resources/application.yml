server:
  port: 9000

spring:
  application:
    name: gw

  datasource:
    driver-class-name: org.h2.Driver
    url: 'jdbc:h2:mem:testdb'   # H2 DB 설정(In-Memory Mode)
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        show_sql: true

# 운영 yml파일에는 아래 설정부분 제거(외부에서 refresh 방지)
# http://localhost:9000/actuator/gateway/routes 로 route 조회
management:
  endpoints:
    web:
      exposure:
        include: gateway
  endpoint:
    gateway:
      enabled: true # default: true